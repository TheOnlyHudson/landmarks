# Draws contact sheets for every landmark a pull request adds or changes
# (`bun run sheet --terrain --branch-diff`) and uploads them as an artifact.
# `sheets-comment.yml` then posts them on the pull request.
#
# This job runs the pull request's own code, which may come from a fork, so
# it has a read-only token and no secrets. It never comments or pushes.
name: Contact sheets

on:
  pull_request:
    paths:
      - 'models/**'
      - 'generators/**'
      - 'catalog/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # Mapterhorn terrain tiles, read by --terrain.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/landmarks/mapterhorn
          key: mapterhorn-${{ github.run_id }}
          restore-keys: mapterhorn-
      - name: Draw the sheets
        env:
          BASE: origin/${{ github.base_ref }}
        run: |
          mkdir -p sheets
          if ! out=$(bun tools/sheet.ts --terrain --branch-diff "$BASE" --out sheets 2>&1); then
            echo "$out"
            # A pull request that touches no landmark has nothing to draw.
            grep -qx 'nothing to draw' <<<"$out" && exit 0
            exit 1
          fi
          echo "$out"
      - name: Record the pull request
        if: hashFiles('sheets/*.png') != ''
        env:
          PR: ${{ github.event.pull_request.number }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "$PR" > sheets/pr
          echo "$HEAD" > sheets/head
      - uses: actions/upload-artifact@v4
        if: hashFiles('sheets/*.png') != ''
        with:
          name: contact-sheets
          path: sheets
          retention-days: 7
