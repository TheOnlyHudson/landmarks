# Posts the contact sheets drawn by `sheets.yml` on their pull request.
#
# GitHub has no API for attaching images to a comment, so the images are
# committed to the `pr-sheets` branch (pr-<number>/<head sha>/sheet-N.png)
# and linked from there by commit. One comment per pull request, updated on
# each push.
#
# This runs from main with write access and never runs pull request code. The
# artifact is untrusted: only PNG files named sheet-N.png are taken, and the
# pull request number is checked against the run's head commit.
name: Contact sheets comment

on:
  workflow_run:
    workflows: [Contact sheets]
    types: [completed]

permissions: {}

jobs:
  comment:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RUN_HEAD: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/download-artifact@v4
        id: download
        continue-on-error: true
        with:
          name: contact-sheets
          path: ${{ runner.temp }}/in
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Check the artifact
        id: check
        if: steps.download.outcome == 'success'
        env:
          IN: ${{ runner.temp }}/in
          OUT: ${{ runner.temp }}/ok
        run: |
          pr=$(head -c 12 "$IN/pr" | tr -d '\n')
          head=$(head -c 41 "$IN/head" | tr -d '\n')
          [[ $pr =~ ^[0-9]{1,7}$ ]] || { echo "::error::bad pull request number"; exit 1; }
          [[ $head =~ ^[0-9a-f]{40}$ && $head == "$RUN_HEAD" ]] || { echo "::error::head commit does not match the run"; exit 1; }
          actual=$(gh api "repos/$REPO/pulls/$pr" --jq .head.sha)
          [[ $actual == "$RUN_HEAD" ]] || { echo "Pull request #$pr has moved on to $actual; skipping."; exit 0; }
          mkdir -p "$OUT"
          n=0
          for f in "$IN"/sheet-*.png; do
            name=$(basename "$f")
            [[ $name =~ ^sheet-[0-9]{1,3}\.png$ ]] || continue
            [[ ! -L $f && $(stat -c %s "$f") -le 15000000 ]] || continue
            [[ $(head -c 8 "$f" | od -An -tx1 | tr -d ' \n') == 89504e470d0a1a0a ]] || continue
            cp "$f" "$OUT/$name"
            n=$((n + 1))
            [[ $n -lt 40 ]] || break
          done
          [[ $n -gt 0 ]] || { echo "No sheets in the artifact."; exit 0; }
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          echo "count=$n" >> "$GITHUB_OUTPUT"
      - name: Commit the sheets to pr-sheets
        id: store
        if: steps.check.outputs.pr != ''
        env:
          PR: ${{ steps.check.outputs.pr }}
          OK: ${{ runner.temp }}/ok
          WORK: ${{ runner.temp }}/store
        run: |
          git init -q "$WORK" && cd "$WORK"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          if git fetch -q --depth 1 origin pr-sheets; then
            git checkout -q -B pr-sheets FETCH_HEAD
          else
            git checkout -q --orphan pr-sheets
            printf 'Contact sheets posted on pull requests by .github/workflows/sheets-comment.yml.\nSafe to delete; old comments then lose their images.\n' > README.md
            git add README.md
          fi
          dir="pr-$PR/$RUN_HEAD"
          rm -rf "$dir" && mkdir -p "$dir"
          cp "$OK"/sheet-*.png "$dir/"
          git add "$dir"
          git diff --cached --quiet || git commit -q -m "Sheets for #$PR at ${RUN_HEAD:0:8}"
          for try in 1 2 3; do
            git push -q origin pr-sheets && break
            git fetch -q --depth 1 origin pr-sheets && git rebase -q FETCH_HEAD
          done
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          ls "$dir" | sort -V > "$RUNNER_TEMP/names"
      - name: Comment on the pull request
        if: steps.store.outputs.sha != ''
        env:
          PR: ${{ steps.check.outputs.pr }}
          SHA: ${{ steps.store.outputs.sha }}
          DIR: ${{ steps.store.outputs.dir }}
        run: |
          marker='<!-- contact-sheets -->'
          {
            echo "$marker"
            echo "### Contact sheets"
            echo
            echo "Every landmark this pull request adds or changes, on the map's terrain, by day and at night, at ${RUN_HEAD:0:8}."
            echo "Drawn with \`bun run sheet --terrain --branch-diff\`."
            echo
            while read -r name; do
              echo "![${name%.png}](https://raw.githubusercontent.com/${REPO}/${SHA}/${DIR}/${name})"
            done < "$RUNNER_TEMP/names"
          } > "$RUNNER_TEMP/body.md"
          id=$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
            --jq "map(select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\")))) | .[0].id // empty" | head -1)
          if [[ -n $id ]]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -F "body=@$RUNNER_TEMP/body.md" > /dev/null
          else
            gh api "repos/$REPO/issues/$PR/comments" -F "body=@$RUNNER_TEMP/body.md" > /dev/null
          fi
